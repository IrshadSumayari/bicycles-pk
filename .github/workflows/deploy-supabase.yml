name: Deploy Supabase
# dev deploys to the staging environment, main/ladyvogue to production.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main/ladyvogue]
permissions:
  contents: read
  actions: read
concurrency:
  group: supabase-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["dev","main/ladyvogue"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main/ladyvogue' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Skip when this environment has no Supabase secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets are not set for this environment; database not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "## Database deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No database migrations or functions were deployed. Configure SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD in the selected GitHub environment, then rerun CI for the current branch head." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Refuse an obsolete CI result
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          test "$current" = "$CHECKED_SHA"
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Apply migrations and deploy named functions
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx --no-install supabase db push
          for function in payment-create payment-webhook payment-check admin-users; do
            npx --no-install supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF"
          done
